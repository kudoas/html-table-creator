name: setup-pnpm
description: Set up pnpm, configure GitHub Packages auth, and run a safe install for my-org repositories.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        cache: 'pnpm'
        node-version: 24.22.2
        registry-url: https://npm.pkg.github.com
        scope: '@kudoas'
    - name: Configure pnpm workspace settings
      shell: bash
      run: |
        pnpm config set --location=project strict-dep-builds true
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
